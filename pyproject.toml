[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "netagrab"
version = "0.1.0"
description = "Download NetAcad courses as PDF, Markdown, or structured JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "markdownify>=1.2,<2",
    "playwright>=1.51,<2",
    "pypdf>=6,<7",
]

[project.scripts]
netagrab = "netagrab.cli:main"

[dependency-groups]
dev = ["pillow>=11,<13"]

[tool.hatch.build.targets.wheel]
packages = ["src/netagrab"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md", "/requirements.txt", "/uv.lock"]
